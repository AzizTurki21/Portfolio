<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Illustrative temperature-controlled valve wiring concept</title><desc id="desc">A generic temperature sensor feeds an ESP8266, which drives a relay and a low-voltage DC valve. Components and pins are examples, not confirmed project wiring.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe3e7" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#233" flood-opacity=".18"/></filter></defs>
<rect width="960" height="540" rx="18" fill="#f7f9f8"/><rect width="960" height="540" rx="18" fill="url(#grid)"/>
<text x="32" y="40" fill="#18364a" font-family="Arial,sans-serif" font-weight="700" font-size="20">SMART VALVE · ILLUSTRATIVE WIRING CONCEPT</text>
<!-- wires behind components -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
<path d="M318 272H380V213H412" stroke="#16a34a"/><path d="M318 301H365V248H412" stroke="#e53935"/><path d="M318 331H389V281H412" stroke="#22292d"/>
<path d="M585 213H661V248H704" stroke="#16a34a"/><path d="M585 248H646V279H704" stroke="#e53935"/><path d="M585 281H671V310H704" stroke="#22292d"/>
<path d="M790 338V392H858V365" stroke="#cf2f2f"/><path d="M815 365V406H882V365" stroke="#252b2e"/>
</g>
<g font-family="Arial,sans-serif" font-size="14" fill="#26333b"><text x="340" y="202">DATA</text><text x="342" y="238">3V3</text><text x="342" y="275">GND</text><text x="627" y="238">GPIO → IN</text><text x="631" y="270">5V → VCC</text><text x="630" y="303">GND</text><text x="817" y="428">12V DC example</text></g>
<!-- controller board -->
<g filter="url(#shadow)"><rect x="412" y="137" width="173" height="210" rx="15" fill="#151a1c" stroke="#7a8588" stroke-width="3"/><rect x="450" y="175" width="98" height="98" rx="9" fill="#252e32" stroke="#849194" stroke-width="2"/><rect x="468" y="194" width="62" height="60" rx="7" fill="#3b464a"/><text x="499" y="163" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">ESP8266</text><text x="499" y="304" text-anchor="middle" fill="#cad4d4" font-family="Arial,sans-serif" font-size="15">controller</text><text x="499" y="326" text-anchor="middle" fill="#a5b0b2" font-family="Arial,sans-serif" font-size="13">temperature decision</text><g fill="#d5dadd"><circle cx="412" cy="213" r="7"/><circle cx="412" cy="248" r="7"/><circle cx="412" cy="281" r="7"/><circle cx="585" cy="213" r="7"/><circle cx="585" cy="248" r="7"/><circle cx="585" cy="281" r="7"/></g></g>
<!-- sensor -->
<g filter="url(#shadow)"><rect x="85" y="210" width="233" height="150" rx="12" fill="#eaf1f1" stroke="#61777d" stroke-width="3"/><rect x="105" y="228" width="74" height="105" rx="10" fill="#fcffff" stroke="#96a9aa" stroke-width="2"/><path d="M142 247v43a17 17 0 1 0 14 0v-43a7 7 0 0 0-14 0z" fill="#ef6b5c"/><text x="235" y="263" text-anchor="middle" fill="#26373e" font-family="Arial,sans-serif" font-size="18" font-weight="700">TEMPERATURE</text><text x="235" y="291" text-anchor="middle" fill="#4d6369" font-family="Arial,sans-serif" font-size="16">sensor example</text><text x="235" y="320" text-anchor="middle" fill="#718184" font-family="Arial,sans-serif" font-size="13">generic 3-wire sensor</text><g fill="#d5dadd"><circle cx="318" cy="272" r="7"/><circle cx="318" cy="301" r="7"/><circle cx="318" cy="331" r="7"/></g></g>
<!-- relay module -->
<g filter="url(#shadow)"><rect x="704" y="204" width="153" height="160" rx="10" fill="#147b45" stroke="#125f39" stroke-width="3"/><rect x="729" y="220" width="105" height="48" rx="5" fill="#145c39"/><text x="781" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">RELAY MODULE</text><text x="781" y="259" text-anchor="middle" fill="#d8f3df" font-family="Arial,sans-serif" font-size="13">driver / switch</text><rect x="728" y="286" width="105" height="57" rx="4" fill="#d6b23b"/><text x="780" y="320" text-anchor="middle" fill="#28351d" font-family="Arial,sans-serif" font-size="15" font-weight="700">COM · NO</text></g>
<!-- valve + dc supply -->
<g filter="url(#shadow)"><rect x="805" y="100" width="124" height="84" rx="10" fill="#fff" stroke="#61777d" stroke-width="3"/><path d="M828 140h27l12-18 12 18h27M855 140l12 19 12-19" fill="none" stroke="#3a6772" stroke-width="5" stroke-linejoin="round"/><text x="867" y="174" text-anchor="middle" fill="#26373e" font-family="Arial,sans-serif" font-size="15" font-weight="700">DC VALVE</text><rect x="770" y="390" width="153" height="70" rx="9" fill="#eef2f2" stroke="#61777d" stroke-width="3"/><text x="846" y="419" text-anchor="middle" fill="#26373e" font-family="Arial,sans-serif" font-size="16" font-weight="700">12V DC SUPPLY</text><text x="846" y="443" text-anchor="middle" fill="#637579" font-family="Arial,sans-serif" font-size="13">example load supply</text></g>
<rect x="28" y="455" width="704" height="55" rx="10" fill="#fff" stroke="#c9d5d8"/><text x="46" y="480" fill="#34464d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Illustrative parts and wiring</text><text x="46" y="500" fill="#53666d" font-family="Arial,sans-serif" font-size="13">Sensor model, valve type, board and pin assignments must be checked against the original build.</text>
</svg>