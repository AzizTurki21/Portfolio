<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">Illustrative temperature based valve control diagram</title><desc id="desc">Conceptual flow from a temperature sensor to an ESP8266 controller and valve driver.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17231b"/><stop offset="1" stop-color="#0a0d0b"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b7f36b"/></marker></defs>
<rect width="900" height="340" rx="18" fill="url(#bg)"/><text x="38" y="42" fill="#b7f36b" font-family="monospace" font-size="15" letter-spacing="2">SMART VALVE · CONCEPTUAL FLOW</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#111a13" stroke="#8ebd5a" stroke-width="2"><rect x="40" y="102" width="180" height="118" rx="14"/><rect x="264" y="102" width="180" height="118" rx="14"/><rect x="488" y="102" width="170" height="118" rx="14"/><rect x="702" y="102" width="158" height="118" rx="14"/></g><g fill="#edf2ed"><text x="130" y="149" font-size="21">Temperature</text><text x="130" y="181" fill="#9aa69c" font-size="15">sensor reading</text><text x="354" y="149" font-size="21">ESP8266</text><text x="354" y="181" fill="#9aa69c" font-size="15">decision logic</text><text x="573" y="149" font-size="21">Driver stage</text><text x="573" y="181" fill="#9aa69c" font-size="15">switch / actuator</text><text x="781" y="149" font-size="21">Valve</text><text x="781" y="181" fill="#9aa69c" font-size="15">open / close</text></g></g>
<g stroke="#b7f36b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M222 161h36"/><path d="M446 161h36"/><path d="M660 161h36"/></g>
<text x="38" y="286" fill="#c8d1c9" font-family="Arial,sans-serif" font-size="15">Illustrative architecture based on the project description; it is not a measured wiring diagram.</text></svg>