<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Illustrative smart-light wiring layout</title><desc id="desc">An ESP8266 conceptually connects to a relay module and a low-voltage lamp. A dashed line represents MQTT communication. Pin mapping is not verified.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe3e7" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#233" flood-opacity=".18"/></filter></defs>
<rect width="960" height="540" rx="18" fill="#f7f9f8"/><rect width="960" height="540" rx="18" fill="url(#grid)"/>
<text x="32" y="40" fill="#18364a" font-family="Arial,sans-serif" font-weight="700" font-size="20">SMART LIGHT · ILLUSTRATIVE WIRING CONCEPT</text>
<!-- communication path -->
<g fill="none" stroke="#3a79b7" stroke-width="3" stroke-dasharray="8 7"><path d="M230 108V82H386V139"/></g><g font-family="Arial,sans-serif" fill="#245b8c"><rect x="275" y="60" width="150" height="34" rx="17" fill="#e2effa"/><text x="350" y="83" text-anchor="middle" font-size="17" font-weight="700">MQTT command</text></g>
<!-- wires behind modules -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
<path d="M345 305H495V224H585" stroke="#e53935"/><path d="M345 330H515V265H585" stroke="#22292d"/>
<path d="M345 263H472V194H585" stroke="#16a34a"/>
<path d="M718 283H779V250H840" stroke="#d88900"/><path d="M718 322H801V337H840" stroke="#252b2e"/>
</g>
<g fill="#26333b" font-family="Arial,sans-serif" font-size="14"><text x="480" y="215">GPIO → IN</text><text x="480" y="248">5V → VCC</text><text x="480" y="282">GND → GND</text><text x="730" y="270">COM / NO</text><text x="739" y="362">low-voltage load</text></g>
<!-- controller board -->
<g filter="url(#shadow)"><rect x="68" y="137" width="280" height="248" rx="16" fill="#151a1c" stroke="#7a8588" stroke-width="3"/><rect x="143" y="174" width="132" height="120" rx="8" fill="#222a2e" stroke="#7f8c8d" stroke-width="2"/><rect x="165" y="199" width="88" height="62" rx="8" fill="#343e42"/><path d="M176 215h66M176 227h66M176 239h66" stroke="#97a3a5" stroke-width="3"/>
<text x="208" y="163" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">ESP8266</text><text x="208" y="322" text-anchor="middle" fill="#c7d1d2" font-family="Arial,sans-serif" font-size="16">MQTT receiver concept</text><text x="208" y="348" text-anchor="middle" fill="#9eacad" font-family="Arial,sans-serif" font-size="14">app publishes ON / OFF</text>
<g fill="#d5dadd"><circle cx="345" cy="194" r="7"/><circle cx="345" cy="224" r="7"/><circle cx="345" cy="263" r="7"/><circle cx="345" cy="305" r="7"/><circle cx="345" cy="330" r="7"/></g><g fill="#24323a" font-family="Arial,sans-serif" font-size="13" text-anchor="end"><text x="330" y="199">GPIO</text><text x="330" y="229">IN</text><text x="330" y="268">3V3</text><text x="330" y="310">5V</text><text x="330" y="335">GND</text></g></g>
<!-- relay -->
<g filter="url(#shadow)"><rect x="585" y="165" width="150" height="190" rx="10" fill="#147b45" stroke="#125f39" stroke-width="3"/><rect x="610" y="183" width="99" height="55" rx="5" fill="#145c39"/><text x="660" y="205" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">1-CHANNEL</text><text x="660" y="226" text-anchor="middle" fill="#d8f3df" font-family="Arial,sans-serif" font-size="15">RELAY MODULE</text><rect x="617" y="264" width="105" height="70" rx="4" fill="#d6b23b"/><circle cx="636" cy="281" r="5" fill="#4a3820"/><circle cx="703" cy="281" r="5" fill="#4a3820"/><text x="669" y="313" text-anchor="middle" fill="#28351d" font-family="Arial,sans-serif" font-size="16" font-weight="700">COM · NO</text></g>
<!-- low voltage lamp -->
<g filter="url(#shadow)"><rect x="815" y="190" width="120" height="174" rx="12" fill="#fffdf5" stroke="#8b9695" stroke-width="3"/><path d="M874 224c-28 0-42 30-25 49 7 8 10 14 11 25h28c1-11 4-17 11-25 17-19 3-49-25-49z" fill="#ffe78a" stroke="#b78623" stroke-width="4"/><path d="M856 303h36M859 314h30M863 325h22" stroke="#657177" stroke-width="5" stroke-linecap="round"/><text x="875" y="350" text-anchor="middle" fill="#25323a" font-family="Arial,sans-serif" font-size="15" font-weight="700">LIGHT LOAD</text></g>
<rect x="28" y="435" width="904" height="76" rx="10" fill="#fff" stroke="#c9d5d8"/><text x="48" y="465" fill="#34464d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Illustrative only</text><text x="48" y="490" fill="#53666d" font-family="Arial,sans-serif" font-size="15">The repository documents the Android MQTT client; receiver firmware, relay hardware and pin mapping are not confirmed.</text>
</svg>